name: 2026.10.29_Paper10.1_1e6_FLUKA
tool: FLUKA
description: 'Paper 10.1 (PNE 2022) - FLUKA: 8 mẫu thủy tinh S1-S8 (Gd2O3), 23 năng
  lượng 15-15000 keV, 10 bề dày, 1711 job x 10^6 hạt. Input lấy từ projects/2026.17.10_Paper10.1_4_tool
  (Fluka_mac/04_Inputs), chỉ đổi tên + số hạt. Mẫu trống (I0): BLANK. So sánh với
  PHITS/OpenMC cùng bài. Sửa 2026-10-29: MATERIAL WHAT(2) (khối lượng nguyên tử) đổi
  sang số âm theo yêu cầu FLUKA 4 (cùng giá trị). EMFCUT electron 1 keV -> 100 keV
  (như Paper1 và lần chạy 10.1 cũ 10^8); LOW-PWXS -1; START có dấu chấm.'
primaries: 1000000
runners_per_account: 10
timeout_minutes: 340
max_rescue_rounds: 3
drive:
  parent_folder_id: ''
  root_folder_id: 1Liv4XfLC2NyM3VhVfzpKwPLVVTQVsUAZ
github:
  repo: ''
subprojects:
- name: MAC
  samples:
  - BLANK
  - S1
  - S2
  - S3
  - S4
  - S5
  - S6
  - S7
  - S8
  thicknesses_cm:
  - 0.0
  - 0.005
  - 0.1
  - 0.3
  - 0.5
  - 0.8
  - 1.0
  - 1.5
  - 2.0
  - 2.5
  - 3.0
  energies_kev:
  - 15.0
  - 20.0
  - 30.0
  - 40.0
  - 50.0
  - 60.0
  - 80.0
  - 100.0
  - 200.0
  - 300.0
  - 400.0
  - 500.0
  - 600.0
  - 800.0
  - 1000.0
  - 2000.0
  - 3000.0
  - 4000.0
  - 5000.0
  - 6000.0
  - 8000.0
  - 10000.0
  - 15000.0
  jobs_file: jobs.csv
  input_template: '{job}.inp'
run:
  command: rfluka -N0 -M1 {input}
  parser: fluka_usrtrack
  parser_options:
    files:
      totflux: '*fort.21'
      peakflux: '*fort.22'
  outputs:
  - '*fort.*'
  - '*.out'
  - '*.err'
  - '*.lis'
  copy_files: []
storage: local
harvest:
  download_outputs: true
analysis:
  type: attenuation
  intensity_column: peakflux_value
  i0:
    mode: blank
    sample: BLANK
  densities_g_cm3:
    S1: 2.39
    S2: 2.725
    S3: 2.908
    S4: 3.103
    S5: 3.836
    S6: 3.909
    S7: 4.181
    S8: 4.411
  theory_csv: theory/mac_theory.csv
